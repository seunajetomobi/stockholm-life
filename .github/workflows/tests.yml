# Tests for every pull request to main, and the test stage of the Deploy workflow (called with workflow_call).
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: Exact commit to test (resolved by the Deploy workflow)
        type: string
        required: true
      browser:
        description: Run the browser suite
        type: boolean
        required: true

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Inside a called workflow the github context is the caller's (Deploy, started by workflow_dispatch),
  # so the only event test used here is "is this a pull request"; a deployment is recognised by its inputs.
  TARGET: ${{ github.event_name == 'pull_request' && github.sha || inputs.sha }}
  EVENT: ${{ github.event_name }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BROWSER_INPUT: ${{ inputs.browser }}

jobs:
  syntax:
    name: tests-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the tests for this commit
        id: src
        run: |
          set -eu
          echo "- event \`$EVENT\`, commit \`$TARGET\`, browser input \`${BROWSER_INPUT:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tests/test_syntax.py ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then
            if git cat-file -e "$BASE_SHA:tests/test_syntax.py" 2>/dev/null; then
              echo "::error::This pull request removes tests/test_syntax.py, which main has."; exit 1
            fi
            echo "::notice::main has no tests/ yet (bootstrap pull request): nothing to run."
            echo "have=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A deployment of a commit from before tests/ existed: check it with main's syntax test
          git checkout "$GITHUB_SHA" -- tests
          echo "::notice::$TARGET predates tests/: checking it with the syntax test from $GITHUB_SHA."
          echo "have=yes" >> "$GITHUB_OUTPUT"
      - if: steps.src.outputs.have == 'yes'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - if: steps.src.outputs.have == 'yes'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: steps.src.outputs.have == 'yes'
        run: python -m pip install -r tests/requirements.txt
      - if: steps.src.outputs.have == 'yes'
        run: python tests/test_syntax.py

  # The browser suite in parallel jobs, split by tests/shard.py (about 20 minutes each instead of about 2 hours in one).
  # The required check is the job tests-browser below, which passes only when every shard has passed.
  browser-shard:
    name: browser shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: syntax
    # Pull requests: always. A deployment (called by Deploy): only when its browser_tests box is ticked.
    # Deliberately does not name the caller's event; see the env comment above.
    if: github.event_name == 'pull_request' || inputs.browser == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the browser tests for this commit
        id: src
        run: |
          set -eu
          if [ -f tests/test_smoke.py ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ] && ! git cat-file -e "$BASE_SHA:tests/test_smoke.py" 2>/dev/null; then
            echo "::notice::main has no browser tests yet (bootstrap pull request): nothing to run."
            echo "have=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::$TARGET has no browser tests (or this pull request removes them). Commits from before tests/ existed are deployed with browser_tests unticked."
          exit 1
      - if: steps.src.outputs.have == 'yes'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - if: steps.src.outputs.have == 'yes'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: steps.src.outputs.have == 'yes'
        run: python -m pip install -r tests/requirements.txt
      - name: Install the Chromium build this Playwright version is made for
        if: steps.src.outputs.have == 'yes'
        run: python -m playwright install --with-deps chromium
      - name: Use that Chromium, never the runner's Google Chrome
        if: steps.src.outputs.have == 'yes'
        run: |
          set -eu
          path=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')
          want=$(python -c 'import json, pathlib, playwright; f = pathlib.Path(playwright.__file__).parent / "driver/package/browsers.json"; print(next(b["browserVersion"] for b in json.loads(f.read_text())["browsers"] if b["name"] == "chromium"))')
          got=$("$path" --version)
          echo "Chromium: $path -> $got (this Playwright expects $want)"
          case "$path" in "$HOME/.cache/ms-playwright/"*) ;; *) echo "::error::Not Playwright's Chromium: $path"; exit 1 ;; esac
          case "$got" in *" $want"*) ;; *) echo "::error::Got '$got', expected Chromium $want"; exit 1 ;; esac
          echo "CHROME=$path" >> "$GITHUB_ENV"
          echo "- browser \`$got\` at \`$path\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Pick this shard's test files, and check that every test runs in exactly one shard
        if: steps.src.outputs.have == 'yes'
        run: |
          # pipefail: a step without `shell:` runs as `bash -e`, so a collection error would otherwise be ignored here
          set -euo pipefail
          # The split from this workflow's own commit, so that a deployment of an older commit without tests/shard.py
          # is split too. --check fails unless every file pytest collects from tests/ is in exactly one shard.
          git show "$GITHUB_SHA:tests/shard.py" > "$RUNNER_TEMP/shard.py"
          python -m pytest --collect-only -q tests | python "$RUNNER_TEMP/shard.py" --tests tests --check "$SHARDS"
          python "$RUNNER_TEMP/shard.py" --tests tests "$SHARD" "$SHARDS" > "$RUNNER_TEMP/files"
          { echo "- shard $SHARD of $SHARDS:"; sed 's/.*/  - `&`/' "$RUNNER_TEMP/files"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run this shard's tests
        if: steps.src.outputs.have == 'yes'
        run: |
          set -eu
          mapfile -t files < "$RUNNER_TEMP/files"
          python -m pytest "${files[@]}"
      - if: always() && steps.src.outputs.have == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: tests/output/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    # The required check. A required check that was skipped counts as passed, so this job runs whatever happened
    # before it (always()) and passes only when every shard passed: a shard that failed, timed out, was cancelled or
    # was skipped (after a failed tests-syntax) fails it. In a deployment without browser tests it is skipped, as the
    # single browser job was.
    name: tests-browser
    needs: [syntax, browser-shard]
    if: always() && (github.event_name == 'pull_request' || inputs.browser == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every browser shard passed
        env:
          SYNTAX: ${{ needs.syntax.result }}
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          echo "- tests-syntax: \`$SYNTAX\`, browser shards: \`$SHARDS\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SHARDS" != success ]; then
            echo "::error::Not every browser shard passed (result: $SHARDS); see the jobs 'browser shard K of N'."
            exit 1
          fi
